# OmniVoice on one RTX 5060 Ti (the card compose assigns is device 0 inside the container).
# Copy of vllm_omni/deploy/omnivoice.yaml @ v0.32.0 with: dtype bfloat16, max_num_seqs 1, memory cap.
async_chunk: false
pipeline: omnivoice

stages:
  - stage_id: 0
    devices: "0"
    enforce_eager: true
    trust_remote_code: true
    distributed_executor_backend: "mp"
    dtype: "bfloat16"
    gpu_memory_utilization: 0.5
    additional_config:
      omnivoice_asr:
        load_asr_on_startup: false
        asr_model_name: "openai/whisper-large-v3-turbo"
        asr_device: null
    max_num_seqs: 1
    request_batch_max_wait_ms: 10
