# The TTS inference server for the xcono/tts module: vLLM-Omni serving OmniVoice
# (k2-fsa/OmniVoice) on :8007 — POST /v1/audio/speech, one whole 24 kHz PCM clip
# per request, voice cloned from the reference baked into the image.
#
#   docker compose up -d                 # build llm/vllm-omni, serve :8007
#   go run ./cmd/say -text "..."         # synthesise against :8007 (writes a WAV)
#   go run ./cmd/play -text "..."        # synthesise and play on the speaker
#
# The server is stateless: everything about conversation — cutting text into
# fragments, queueing, barge-in — lives in the Go module (pkg/play).
# Measurements, the two patches and the reasons: docs/tts-engine.md.
#
# Decoupled from xcono/voices but joins the same `voices` network and reuses the
# shared HF weight cache, so the orchestrator reaches it as `tts:8007` when both
# stacks are up — and it still runs on its own for TTS debugging.
#
# DO NOT build/up in a sandbox — needs the GPU box + NVIDIA Container Toolkit.
# The base image is 35 GB; build with the local builder (BUILDX_BUILDER=default)
# so it is not pulled again into a container builder's own cache.

name: tts

services:
  tts:
    build:
      context: ./llm/vllm-omni
    image: xcono-tts-vllm
    ipc: host                        # vLLM's worker processes share memory
    ports:
      - "8007:8007"
    environment:
      # Weights come from the shared cache; never reach out to the Hub at start.
      # Set HF_HUB_OFFLINE=0 for the first run on a machine without the weights.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_GPU:-1}"]   # GPU1 by default; override for a single-card box
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

# Shared with the xcono/voices stack so weights are downloaded once.
volumes:
  hf-cache:
    name: llms_hf-cache
    external: true

# Literal `voices` network so this service and the voices orchestrator co-reside.
networks:
  default:
    name: voices
